<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="STEM Pocket Notes：可持續擴充的繁體中文理工學習筆記網站。">
  <title>STEM Pocket Notes｜理工隨身筆記</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a href="#" class="brand" id="home-link" aria-label="返回首頁"><span class="brand-mark">✳</span><span>STEM <strong>Pocket Notes</strong></span></a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false">☾ <span>深色模式</span></button>
    </header>
    <main>
      <section class="hero" aria-labelledby="site-title">
        <span class="eyebrow">LEARN · ORGANIZE · GROW</span>
        <h1 id="site-title">把複雜知識，<br><span>整理成自己的節奏。</span></h1>
        <p>從微積分到程式設計，把每一次理解都留下來。這是一個依照 <code>AGENTS.md</code> 規則持續成長的理工筆記庫。</p>
        <div class="hero-stats"><div><strong id="note-count">—</strong><small>篇精選筆記</small></div><div><strong id="category-count">—</strong><small>個知識分類</small></div><div><strong>∞</strong><small>持續擴充</small></div></div>
      </section>
      <section id="library" class="library" aria-labelledby="library-title">
        <div class="section-heading"><div><span class="eyebrow">THE LIBRARY</span><h2 id="library-title">探索筆記</h2></div><span id="result-count" class="result-count" aria-live="polite"></span></div>
        <div id="list-view">
          <label for="search" class="sr-only">搜尋筆記</label>
          <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜尋標題、標籤或關鍵字…" autocomplete="off"></div>
          <div id="filters" class="filters" aria-label="筆記分類"></div>
          <div id="cards" class="cards" aria-live="polite"><p class="state-message">載入筆記中…</p></div>
        </div>
        <article id="detail-view" class="detail-view" hidden>
          <button id="back-button" class="back-button" type="button">← 返回所有筆記</button>
          <div id="detail-meta" class="detail-meta"></div>
          <div id="detail-content" class="article-content"></div>
        </article>
      </section>
    </main>
    <footer><span>© 2026 STEM Pocket Notes</span><span>Built with HTML · CSS · JavaScript · AGENTS.md</span></footer>
  </div>
</body>
</html>
